services:
  api:
    build: .
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      FEATFORGE_DB: /data/featforge.db
    volumes:
      - featforge-data:/data
    restart: unless-stopped

  # 回填/重算执行器。可独立扩容多个副本：作业靠原子 claim 去重，
  # 不会被两个执行者重复执行。
  worker:
    build: .
    command: ["worker"]
    environment:
      FEATFORGE_DB: /data/featforge.db
      FEATFORGE_WORKER_POLL: "1"
    volumes:
      - featforge-data:/data
    restart: unless-stopped
    depends_on:
      - api

volumes:
  featforge-data:
